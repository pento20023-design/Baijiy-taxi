name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q baiji_flutter.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate android folder
        working-directory: src/baiji/${{ matrix.app }}
        run: flutter create . --platforms=android --org com.baiji

      - name: Patch Android config
        working-directory: src/baiji/${{ matrix.app }}
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          python3 - << 'PY'
          import os, re, glob, shutil
          app = os.environ["APP_NAME"]
          label = {"customer": "تكسي بيجي", "driver": "سائق تكسي بيجي", "admin": "إدارة تكسي بيجي"}[app]

          mf = "android/app/src/main/AndroidManifest.xml"
          s = open(mf, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <queries>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
              </queries>
          """
          s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          s = re.sub(r"(<application[^>]*>)", lambda m: m.group(1) + '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % label, s, count=1)
          open(mf, "w", encoding="utf-8").write(s)

          g = glob.glob("android/app/build.gradle*")[0]
          t = open(g, encoding="utf-8").read()
          if g.endswith(".kts"):
              t = t.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              t = t.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              t += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          # تعطيل التصغير (R8) صراحةً
          if g.endswith(".kts"):
              t = re.sub(r"(release\s*\{)", r"\1\n            isMinifyEnabled = false\n            isShrinkResources = false", t, count=1)
          else:
              t = re.sub(r"(release\s*\{)", r"\1\n            minifyEnabled false\n            shrinkResources false", t, count=1)
          open(g, "w", encoding="utf-8").write(t)

          # أيقونة التطبيق
          for d in glob.glob("icons/mipmap-*"):
              dst = "android/app/src/main/res/" + os.path.basename(d)
              os.makedirs(dst, exist_ok=True)
              shutil.copy(d + "/ic_launcher.png", dst + "/ic_launcher.png")
          # أيقونة الإشعارات (بيضاء شفافة)
          for d in glob.glob("icons/drawable-*"):
              dst = "android/app/src/main/res/" + os.path.basename(d)
              os.makedirs(dst, exist_ok=True)
              shutil.copy(d + "/ic_notification.png", dst + "/ic_notification.png")
          PY

      - run: flutter pub get
        working-directory: src/baiji/${{ matrix.app }}

      # --no-shrink: يمنع خطأ SharedPreferences الذي كان يُسجّل خروج المستخدم
      - run: flutter build apk --release --no-shrink
        working-directory: src/baiji/${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: baiji-${{ matrix.app }}-apk
          path: src/baiji/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
